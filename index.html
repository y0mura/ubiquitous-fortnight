<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0c11"><title>ReelFlow</title>
<style>
:root{--bg:#0b0c11;--ink:#eceae4;--dim:#9a9aa6;--acc:#8fd0ff;--hot:#ffb36b;--glass:rgba(24,25,33,.55);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 13px/1.3 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
.pill{height:40px;min-width:40px;padding:0 12px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);transition:transform .12s,background .2s,border-color .2s,color .2s;white-space:nowrap}

.pill.glow{border-color:var(--hot);color:var(--hot);box-shadow:0 0 0 3px rgba(255,179,107,.18)}
.pill svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#top{position:fixed;z-index:20;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;transition:opacity .25s,transform .25s}
#top>*{pointer-events:auto}
.row{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.sp{flex:1}
#rail{position:fixed;z-index:20;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;transition:opacity .25s}
body.cl #top,body.cl #rail,body.cl .vb,body.cl .sw,body.zoomed #top,body.zoomed #rail,body.zoomed .vb,body.zoomed .sw{opacity:0;pointer-events:none}
#rs{position:fixed;z-index:30;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);opacity:.55}
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;touch-action:pan-y;background:#000}
.card.zm{touch-action:none}
.bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(40px) brightness(.45) saturate(1.3);pointer-events:none}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.main{position:relative;width:100%;height:100%;object-fit:contain;will-change:transform;transition:transform .3s cubic-bezier(.2,.8,.2,1);-webkit-user-drag:none}
.stage.dragging .main{transition:none}
video.main{background:#000}
.gl{position:absolute;inset:0;z-index:2}
.cp{position:absolute;z-index:3;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(.8);transition:.2s}
.cp.show{opacity:1;pointer-events:auto;transform:none}
.cp svg{width:22px;height:22px;fill:currentColor}
.fb{position:absolute;z-index:4;top:50%;margin-top:-18px;padding:6px 14px;border-radius:18px;background:rgba(0,0,0,.55);font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
.fb.l{left:22px}.fb.r{right:22px}.fb.s{opacity:1;transition:none}
.vb{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;justify-content:space-between;align-items:flex-end;gap:8px;transition:opacity .25s}
.vb .mid{display:flex;gap:6px}
.vb .pill{height:34px;padding:0 10px;font-size:11px;font-weight:700}
.vb .sk{height:42px;flex:1;max-width:112px;border-radius:16px}
.sw{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transition:opacity .25s}
.scrub{width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none}
.scrub::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:var(--ink)}
.scrub::-moz-range-track{height:3px;background:rgba(255,255,255,.25)}
.scrub::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--ink)}
.main.e1{filter:url(#sh1) contrast(1.05) saturate(1.08) brightness(var(--b,1))}
.main.e2{filter:url(#sh2) contrast(1.09) saturate(1.14) brightness(var(--b,1))}
.main.e3{filter:url(#sh3) contrast(1.14) saturate(1.2) brightness(var(--b,1))}
.main.eb{filter:brightness(var(--b,1))}
.lab{color:var(--dim);padding:0 2px;flex:none}
.pill.ic{padding:0 10px;gap:3px}.pill s{text-decoration:none;font-size:9px;opacity:.65}.pill em{font-style:normal;font-size:11px;font-weight:700}
#pop{position:fixed;z-index:60;min-width:170px;max-width:84vw;padding:8px;border-radius:18px;background:rgba(22,23,31,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .16s,transform .16s}
#pop.open{opacity:1;transform:none;pointer-events:auto}
#pop h4{margin:6px 6px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700}
#pop .g{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 4px}
#pop .o{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);transition:background .15s}
#pop .o.on{background:rgba(143,208,255,.18);color:var(--acc)}
.bb{width:36px;padding:0!important}
.zo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:0;will-change:transform}
.stage[class*=" z-"] .zo{opacity:1}.card.zm .zo{opacity:0!important}
@keyframes zi1{0%{transform:scale(1)}76%,82%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes zi2{0%{transform:scale(1)}76%,82%{transform:scale(1.34)}100%{transform:scale(1)}}
@keyframes zi3{0%{transform:scale(1)}76%,82%{transform:scale(1.52)}100%{transform:scale(1)}}
@keyframes zb{0%,100%{transform:scale(1)}50%{transform:scale(1.34)}}
@keyframes zo1{0%{transform:scale(1.18)}76%,82%{transform:scale(1)}100%{transform:scale(1.18)}}
@keyframes zo2{0%{transform:scale(1.34)}76%,82%{transform:scale(1)}100%{transform:scale(1.34)}}
@keyframes zd{0%{transform:scale(1)}76%,82%{transform:scale(var(--zs,1.3))}100%{transform:scale(1)}}
.z-1 .zo{animation:zi1 5.8s cubic-bezier(.35,.1,.25,1) infinite}.z-2 .zo{animation:zi2 6s cubic-bezier(.35,.1,.25,1) infinite}.z-3 .zo{animation:zi3 6.3s cubic-bezier(.35,.1,.25,1) infinite}
.z-4 .zo{animation:zb 2.8s ease-in-out infinite}.z-out .zo{animation:zo1 5.8s cubic-bezier(.35,.1,.25,1) infinite}.z-out-2 .zo{animation:zo2 6s cubic-bezier(.35,.1,.25,1) infinite}.z-dynamic .zo{animation:zd 6s cubic-bezier(.35,.1,.25,1) infinite}
.hzw{position:absolute;inset:0}
.card.hz{overflow:visible;touch-action:none}
.card.hz .hzw{position:fixed;inset:auto;z-index:55;left:50%;top:50%;width:100vh;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);background:#000}
body.hzon #top,body.hzon #rail{opacity:0;pointer-events:none}

#grid{position:fixed;inset:0;z-index:40;background:#09090b;display:flex;flex-direction:column}
#gbar{position:absolute;z-index:4;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px;display:flex;flex-direction:column;gap:7px;transition:transform .28s cubic-bezier(.2,.8,.2,1);background:linear-gradient(#09090bd9,#09090b00);pointer-events:none}
#gbar>*{pointer-events:auto}#gbar.hid{transform:translateY(-130%)}
#gshow{position:absolute;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translateX(-50%);height:28px;min-width:54px;opacity:.8}
#gs{flex:1;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;padding-top:calc(env(safe-area-inset-top,0px) + 62px);touch-action:pan-x pan-y}
#gs::-webkit-scrollbar{display:none}#grid.iscol #gs{padding-top:0}
.gem{padding:40vh 20px;text-align:center;color:var(--dim)}
.tile{position:relative;overflow:hidden;background:#14151d;contain:layout paint}
.tile .tm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform;backface-visibility:hidden}
.tile .ph{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;color:var(--dim);padding:8px;background:radial-gradient(120% 80% at 50% 0,#1c2030,#101117);font-size:11px;word-break:break-all}
.tile .ph b{color:var(--ink);font-size:12px}
.tile .hd{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.5);font-size:10px;font-weight:700;max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.gS{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}.gS .tile{aspect-ratio:9/18;border-radius:10px}
.gM{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px}.gM .tile{aspect-ratio:9/14;border-radius:12px}
.gL{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px}.gL .tile{height:73vh;border-radius:14px}
.gXL{display:grid;grid-template-columns:1fr;gap:4px;padding:4px}.gXL .tile{height:78vh;border-radius:16px}
.gLe{padding:0 4px 4px}.erow{display:flex;gap:4px;margin-top:4px}.erow .tile{height:73vh;flex:0 0 50%;min-width:0;border-radius:14px}
@keyframes efl{0%,6%{flex-basis:64%}47%,53%{flex-basis:36%}94%,100%{flex-basis:64%}}
@keyframes efr{0%,6%{flex-basis:36%}47%,53%{flex-basis:64%}94%,100%{flex-basis:36%}}
.erow.o .tile:first-child,.erow.e .tile:last-child{animation:efl 6.2s cubic-bezier(.42,0,.58,1) infinite}
.erow.o .tile:last-child,.erow.e .tile:first-child{animation:efr 6.2s cubic-bezier(.42,0,.58,1) infinite}
@keyframes bza{0%,6%{transform:scale(1.04)}47%,53%{transform:scale(1.32)}94%,100%{transform:scale(1.04)}}
@keyframes bzb{0%,6%{transform:scale(1.32)}47%,53%{transform:scale(1.04)}94%,100%{transform:scale(1.32)}}
.gz-bounce .erow.o .tile:first-child .tm,.gz-bounce .erow.e .tile:last-child .tm{animation:bza 6.2s cubic-bezier(.42,0,.58,1) infinite}
.gz-bounce .erow.o .tile:last-child .tm,.gz-bounce .erow.e .tile:first-child .tm{animation:bzb 6.2s cubic-bezier(.42,0,.58,1) infinite}
.gz-1 .tm{animation:zi1 5.8s cubic-bezier(.35,.1,.25,1) infinite}.gz-2 .tm{animation:zi2 6s cubic-bezier(.35,.1,.25,1) infinite}.gz-3 .tm{animation:zi3 6.3s cubic-bezier(.35,.1,.25,1) infinite}
.gz-4 .tm{animation:zb 2.8s ease-in-out infinite}.gz-out .tm{animation:zo1 5.8s cubic-bezier(.35,.1,.25,1) infinite}.gz-out-2 .tm{animation:zo2 6s cubic-bezier(.35,.1,.25,1) infinite}
.gz-dynamic .tm[data-ori=p]{animation:zi1 5.8s cubic-bezier(.35,.1,.25,1) infinite}.gz-dynamic .tm[data-ori=l]{animation:zo2 6s cubic-bezier(.35,.1,.25,1) infinite}
.pt .fl{position:absolute;inset:0;backface-visibility:hidden;opacity:0;transform:rotateY(90deg);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s}.pt .fl.a{opacity:1;transform:none}.pt{perspective:800px}
.pt .pn{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:700;display:flex;justify-content:space-between;align-items:flex-end;z-index:2}
.pt .pn b{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.14)}
.cw{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:calc(20vh*var(--z,1));grid-auto-flow:dense;background:#09090b;width:calc(100%*var(--z,1));margin:0 auto}
.cw .tile{border-radius:0;border:.5px solid rgba(9,9,11,.35)}
.tile .ov{position:absolute;inset:0;z-index:3;display:none;place-content:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}.tile.ovon .ov{display:grid}
.ov button{padding:9px 14px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:12px}
.gsb{position:absolute;z-index:6;border-radius:9px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);touch-action:none}
.gsb i{position:absolute;border-radius:9px;background:linear-gradient(135deg,rgba(143,208,255,.9),rgba(190,160,255,.9));border:1px solid rgba(255,255,255,.5)}
#gvs{left:6px;top:90px;bottom:90px;width:12px}#gvs i{left:0;right:0}#ghs{left:90px;right:90px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:12px}#ghs i{top:0;bottom:0}
.seg{display:inline-flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--glass)}.seg .pill{border:0;border-radius:0;background:none;backdrop-filter:none}.seg .pill.on{background:rgba(143,208,255,.18)}
#ss{position:absolute;inset:0;z-index:9;background:#000}.sl{position:absolute;inset:0;opacity:0;transition:opacity .9s}.sl.on{opacity:1}.sl img,.sl video{width:100%;height:100%;object-fit:contain}
.wf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.edge{position:absolute;z-index:3;left:0;top:0;bottom:0;width:22px}.lockon .edge{display:none}
.tabs .seg .pill{height:36px;font-size:12px;padding:0 11px}.tabs em,.lab em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.14)}
.list{display:flex;flex-direction:column;gap:6px;max-height:46dvh;overflow:auto;margin-top:8px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#1b1d27;border:1px solid var(--line)}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}.li .t small{display:block;color:var(--dim);font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.li button{height:30px;padding:0 11px;border-radius:15px;background:#2a2d3a;font-size:11px;font-weight:700;flex:none}.li button.danger{color:#ff8d8d}
.opt{margin-top:8px;color:var(--dim)}.opt summary{padding:6px 2px;cursor:pointer}.opt .row{margin:6px 0}
.opt select,.mm input,.mm textarea,#dta,#asq{background:#0d0e14;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;user-select:text;-webkit-user-select:text}
.tg{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:14px;background:#1b1d27;border:1px solid var(--line);color:var(--ink)}
#mm{position:fixed;inset:0;z-index:65;background:rgba(5,6,9,.62);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}#mm.open{display:flex}
.mm{width:100%;max-width:420px;background:#14151d;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mm h3{margin:0;font-size:16px}.mm p{margin:0;color:var(--dim);font-size:12px;word-break:break-all}.mm textarea{height:110px;resize:none}
.empty{display:grid;place-content:center;gap:14px;text-align:center;height:100%;padding:24px}
.empty h2{margin:0;font-size:22px;font-weight:700}.empty p{margin:0;color:var(--dim);max-width:260px}
.wp{display:grid;place-content:center;gap:14px;text-align:center;height:100%;padding:28px;background:radial-gradient(120% 80% at 50% 0,#1a1d2b,#0b0c11)}
.wp b{word-break:break-all;font-weight:600;color:var(--dim)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,9,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
#modal.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow:auto;background:#14151d;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#modal.open .sheet{transform:none}
.sheet h2{margin:0;font-size:17px;font-weight:700}
.sheet .row{margin:10px 0;overflow:visible;flex-wrap:wrap}
.big{height:46px;flex:1;border-radius:14px;background:#22242f;border:1px solid var(--line);font-weight:700}
.big.go{background:var(--acc);color:#07131d;border-color:transparent}
.big.glow{border-color:var(--hot);color:var(--hot)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header id="top">
 <div class="row">
  <button class="pill ic" id="bf" title="Filter & sort"><i data-i="filter"></i><s>▾</s></button>
  <button class="pill ic" id="bz" title="Feed zoom"><i data-i="zoom"></i><em id="zl"></em><s>▾</s></button>

  <button class="pill" id="bp" title="Batch URLs & banks"><i data-i="plus"></i><span id="cnt">0</span></button>
 </div>
 <div class="row">
  <button class="pill on" id="bkg" hidden></button><button class="pill" id="pc" hidden></button><button class="pill" id="px" hidden>✕</button><button class="pill" id="bmd" hidden></button><button class="pill" id="blk" hidden></button><button class="pill" id="be" hidden>✨ Enhance</button><button class="pill" id="bv" hidden>▾</button>
  <span class="sp"></span>

  <button class="pill" data-l="1">1</button><button class="pill" data-l="2">2</button><button class="pill" data-l="3">3</button>

  if(S.set.sniff&&!SNIFF[pg])extract({source:pg,url:pg}).then(st=>{if(st){SNIFF[pg]=st;toast('Video found: Paste & Link → Sniffed')}})})}
function saveCap(u,t,pg){const it=V[S.idx],hd=(it&&it.handle)||profOf(pg);const n=attach([u],hd);toast(n?`✓ Saved ${t} to @${alias(hd)}`:'Already saved');chips()}
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='REELFLOW_CAPTURE_PROFILE_MEDIA')return;const f=feed.querySelector(`.card[data-i="${S.idx}"] iframe`);if(!f||e.source!==f.contentWindow)return;saveCap(String(d.mediaUrl||''),d.mediaType==='video'?'video':'image',String(d.pageUrl||''))});
function pageUI(it){const pg=isPageCard(it),vid=it&&it.type==='video'&&(it.source||!isDirect(it.url));
 $('#bmd').hidden=!vid;$('#bmd').textContent=pg?'▶ Video':'🔗 Page';$('#blk').hidden=!pg;$('#blk').textContent=S.lock?'🔒 Locked':'🔓 Lock';$('#blk').classList.toggle('on',S.lock);
 $('#pr').hidden=!pg;$('#pm').hidden=S.mode!=='disc';$('#pa').textContent='+ To @'+((it&&it.handle)||'profile');
 document.body.classList.toggle('lockon',!!(S.lock&&pg));if(!Z.on&&!document.body.classList.contains('hzon'))feed.style.overflowY=(S.lock&&pg)?'hidden':'scroll'}
$('#bmd').onclick=()=>{const it=V[S.idx];if(!it)return;PM.set(it.id,isPageCard(it)?'video':'page');const s=feed.querySelector(`.card[data-i="${S.idx}"]`);dehyd(s);hyd(s,S.idx);sync()};
$('#blk').onclick=()=>{S.lock=!S.lock;hud();toast(S.lock?'Page locked: swiping is off until unlocked':'Page unlocked')};
$('#pl').onclick=()=>{const it=V[S.idx];if(it)teach(it)};
$('#pa').onclick=()=>{const it=V[S.idx];if(it)addMediaModal(it.handle,()=>{})};
$('#pdz').onclick=async()=>{try{const t=(await navigator.clipboard.readText()).trim().split(/\s+/)[0];if(!/^https?:\/\//i.test(t))return toast('Copy an image or video link first');const it=V[S.idx];saveCap(t,/\.(mp4|webm|m4v|mov|m3u8)(\?|#|$)/i.test(t)?'video':'image',it?pageUrl(it):'')}catch(e){toast('Clipboard blocked')}};
$('#pdz').ondragover=e=>e.preventDefault();$('#pdz').ondrop=e=>{e.preventDefault();const t=(e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain')||'').trim().split(/\s+/)[0];if(/^https?:\/\//i.test(t)){const it=V[S.idx];saveCap(t,/\.(mp4|webm|m4v|mov|m3u8)(\?|#|$)/i.test(t)?'video':'image',it?pageUrl(it):'')}};
$('#pm').onclick=()=>{S.mode='main';S.idx=S.mainIdx||0;render();toast('Back to main feed')};
/* ---------- batch tabs: discovery, unlinked, active feed ---------- */
function launchDisc(k){if(!S.disc.length)return toast('Save some profile pages first');if(S.mode!=='disc')S.mainIdx=S.idx;S.mode='disc';S.discItems=S.disc.map((u,j)=>({id:'d'+j,url:u,source:'',type:'webpage',ch:'',handle:profOf(u),seq:j,sess:0,disc:1}));S.idx=k||0;closeModal();render()}
const unlinked=()=>S.items.filter(i=>i.type==='webpage'||(i.type==='video'&&!isDirect(i.url)&&!TAUGHT[strip(i.url)]));
function chips(){$('#chd').textContent=S.disc.length;$('#chu').textContent=unlinked().length;$('#cha').textContent=S.items.length}
const short=u=>{try{const x=new URL(strip(u));return x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/$/,'')}catch(e){return u}};
function renderDisc(){$('#dlist').innerHTML=S.disc.map((u,k)=>`<div class="li"><div class="t">@${esc(profOf(u))}<small>${esc(u)}</small></div><button data-d="open" data-k="${k}">Open</button><button class="danger" data-d="del" data-k="${k}">✕</button></div>`).join('')||'<p class="lab">No saved profiles yet.</p>';chips()}
function renderUnl(){const L=unlinked().slice(0,150);$('#ulist').innerHTML=L.map(it=>`<div class="li"><div class="t">@${esc(it.handle)}<small>${esc(short(it.url))}</small></div><button data-u="go" data-id="${it.id}">Go</button><button data-u="link" data-id="${it.id}">Link</button></div>`).join('')||'<p class="lab">Everything is linked.</p>';chips()}
const ACTN=150;let delArm=null;
function renderAct(){const q=$('#asq').value.trim().toLowerCase();let L=S.items;if(q)L=L.filter(i=>(i.handle+' '+i.url+' '+(i.source||'')).toLowerCase().includes(q));
 $('#alist').innerHTML=L.slice(0,ACTN).map(it=>`<div class="li"><span>${it.type==='video'?'▶':it.type==='image'?'🖼':'🔗'}</span><div class="t">@${esc(it.handle)}<small>${esc(short(it.url))}</small></div><button data-a="go" data-id="${it.id}">Go</button><button class="danger" data-a="del" data-id="${it.id}">Delete</button></div>`).join('')+(L.length>ACTN?`<p class="lab">Showing ${ACTN} of ${L.length}. Search to narrow.</p>`:'')||'<p class="lab">No matches.</p>';chips()}
function goItem(id){let i=V.findIndex(x=>x.id===id);if(i<0&&S.mode==='main'){S.filter='all';S.sort='default';S.prof=null;V=vis();i=V.findIndex(x=>x.id===id);render()}if(i<0)return toast('Not in the current feed');closeModal();S.idx=i;jump(i,false);sync()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));['paste','disc','unl','act'].forEach(k=>$('#tp-'+k).hidden=k!==t);if(t==='disc')renderDisc();if(t==='unl')renderUnl();if(t==='act')renderAct()});
$('#asq').addEventListener('input',renderAct);
$('#dpc').onclick=()=>pasteInto($('#dta'));
$('#dsv').onclick=()=>{const u=dt($('#dta').value).split(/\s+/).map(strip).filter(t=>/^https?:\/\//i.test(t));if(!u.length)return toast('No page links found');const n0=S.disc.length;S.disc=[...new Set(S.disc.concat(u))];$('#dta').value='';save();setDirty(true);renderDisc();toast(`Saved ${S.disc.length-n0} profile${S.disc.length-n0===1?'':'s'}`)};
$('#dgo').onclick=()=>launchDisc(0);
$('#dlist').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const k=+b.dataset.k;if(b.dataset.d==='open')launchDisc(k);else{S.disc.splice(k,1);save();setDirty(true);renderDisc()}};
$('#ulist').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;const it=S.items.find(x=>x.id===b.dataset.id);if(!it)return;if(b.dataset.u==='go')goItem(it.id);else teach(it)};
$('#alist').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id;if(b.dataset.a==='go')return goItem(id);
 if(delArm!==id){delArm=id;b.textContent='Confirm?';setTimeout(()=>{if(delArm===id){delArm=null;if(b.isConnected)b.textContent='Delete'}},3000);return}
 delArm=null;S.items=S.items.filter(x=>x.id!==id);save();setDirty(true);if(S.mode==='main'){V=vis();if(S.idx>=V.length)S.idx=0;render()}renderAct();toast('Deleted')};
/* ---------- options ---------- */
function optUI(){$('#s-off').value=String(S.set.off);$('#s-mode').value=S.set.mode;$('#s-ad').checked=S.set.ad;$('#s-mute').checked=S.muted;$('#s-shuf').checked=S.set.shuf;$('#s-sniff').checked=S.set.sniff}
$('#s-off').onchange=e=>{S.set.off=+e.target.value;save()};$('#s-mode').onchange=e=>{S.set.mode=e.target.value;save()};
$('#s-ad').onchange=e=>{S.set.ad=e.target.checked;save()};$('#s-shuf').onchange=e=>{S.set.shuf=e.target.checked;save()};$('#s-sniff').onchange=e=>{S.set.sniff=e.target.checked;save()};
$('#s-mute').onchange=e=>{S.muted=e.target.checked;feed.querySelectorAll('video').forEach(v=>v.muted=S.muted);hud();save()};
function post(p){if(S.set.mode!=='auto')p.items.forEach(i=>i.type=S.set.mode);if(S.set.shuf)for(let k=p.items.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[p.items[k],p.items[j]]=[p.items[j],p.items[k]]}return p}
/* ---------- memory banks ---------- */
let BT=1,BM='save',BD=0;
function bnk(){document.querySelectorAll('.bb[data-b]').forEach(b=>{const n=S.banks[+b.dataset.b].length;b.classList.toggle('on',n>0);b.title=n?`Bank ${b.dataset.b} · ${n} links (tap to recall)`:`Bank ${b.dataset.b} · empty`});document.querySelectorAll('.bb[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===BT))}
function bankPop(m){BM=m;BD=0;$('#bkp').hidden=false;$('#bkq').textContent=m==='save'?'Save to bank':'Delete bank';$('#bka').hidden=$('#bko').hidden=m!=='save';$('#bkc').hidden=m==='save';$('#bkc').textContent='Delete';bnk()}
const bankUrls=()=>{const b=parse(ta.value).items,src=b.length?b:S.items;return src.filter(i=>!i.url.startsWith('data:')).map(lineOf)};
document.querySelectorAll('.bb[data-b]').forEach(b=>b.onclick=()=>{const n=+b.dataset.b,l=S.banks[n];if(!l.length){BT=n;bankPop('save');return}
 const p=parse(l.join('\n'));if(!p.items.length)return toast('Bank '+n+' has no usable links');S.items=p.items;commit();setDirty(false);closeModal();toast(`Recalled Bank ${n}: ${tally(p)}`)});
document.querySelectorAll('.bb[data-t]').forEach(b=>b.onclick=()=>{BT=+b.dataset.t;BD=0;$('#bkc').textContent='Delete';bnk()});
$('#bks').onclick=()=>bankPop('save');$('#bkd').onclick=()=>bankPop('delete');$('#bkx').onclick=()=>$('#bkp').hidden=true;
$('#bka').onclick=()=>{const u=bankUrls();if(!u.length)return toast('Nothing to save yet');const s=new Set(),m=S.banks[BT].concat(u).filter(x=>{const k=normKey(x);if(s.has(k))return false;s.add(k);return true});S.banks[BT]=m;save();setDirty(true);bnk();$('#bkp').hidden=true;toast(`Added to Bank ${BT} (${m.length} links)`)};
$('#bko').onclick=()=>{const u=bankUrls();if(!u.length)return toast('Nothing to save yet');S.banks[BT]=u;save();setDirty(true);bnk();$('#bkp').hidden=true;toast(`Saved ${u.length} links to Bank ${BT}`)};
$('#bkc').onclick=()=>{if(!S.banks[BT].length)return toast(`Bank ${BT} is already empty`);if(!BD){BD=1;$('#bkc').textContent=`Confirm delete bank ${BT}?`;return}S.banks[BT]=[];BD=0;save();setDirty(true);bnk();$('#bkp').hidden=true;toast(`Deleted Bank ${BT}`)};
/* ---------- boot ---------- */
bnk();chips();optUI();render();
</script></body></html>
